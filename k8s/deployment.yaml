apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
  namespace: lab
  labels:
    app: lab-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-app
  template:
    metadata:
      labels:
        app: lab-app
    spec:
      containers:
        - name: wildfly
          image: lab-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: lab-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-secret
                  key: db-password
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 768Mi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /app/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /app/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
